<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный журнал (Тест)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #1a1c23; color: white; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #262933; padding: 20px; border-radius: 12px; }
        h1 { text-align: center; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #3d4250; color: white; }
        button { background: #2196f3; color: white; font-weight: bold; cursor: pointer; }
        .grade-item { background: #2d3341; padding: 10px; margin-bottom: 5px; border-radius: 6px; display: flex; justify-content: space-between; }
        .error-box { background: #3d1c1c; border: 1px solid #ff5252; padding: 10px; border-radius: 6px; margin-top: 15px; color: #ff5252; font-weight: bold; word-break: break-all; }
        .success-box { background: #1c3d1c; border: 1px solid #4caf50; padding: 10px; border-radius: 6px; margin-top: 15px; color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Электронный журнал (Тест)</h1>
        
        <h3>Выставить оценку</h3>
        <input type="text" id="studentName" placeholder="Фамилия студента (напр. Иванов)">
        <input type="text" id="subject" placeholder="Предмет (напр. Математика)">
        <input type="number" id="gradeValue" placeholder="Оценка (2-5)">
        <button onclick="addGrade()">Сохранить в базу</button>

        <h3>Последние оценки</h3>
        <div id="gradesList">Загрузка...</div>
        
        <!-- Сюда будут выводиться ошибки -->
        <div id="statusMessage"></div>
    </div>

    <script>
        // ⚠️ УБЕДИТЕСЬ, ЧТО ЗДЕСЬ НЕТ ЛИШНИХ ПРОБЕЛОВ!
       const SUPABASE_URL = 'https://shqmvjuxgcyjfakfpxnl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Bx6GJhbEj4qPTfxce5U7mg_FwIFv...';
        
        const statusDiv = document.getElementById('statusMessage');
        const listDiv = document.getElementById('gradesList');

        if (SUPABASE_URL.includes('ВСТАВЬТЕ') || SUPABASE_KEY.includes('ВСТАВЬТЕ')) {
            listDiv.innerHTML = '';
            statusDiv.className = 'error-box';
            statusDiv.innerHTML = 'Ошибка: Вы не вставили URL или ключ в код!';
        } else {
            try {
                const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                async function addGrade() {
                    const studentName = document.getElementById('studentName').value.trim();
                    const subject = document.getElementById('subject').value.trim();
                    const gradeValue = parseInt(document.getElementById('gradeValue').value);

                    if (!studentName || !subject || !gradeValue) {
                        statusDiv.className = 'error-box';
                        statusDiv.innerHTML = 'Заполните все поля!';
                        return;
                    }

                    statusDiv.innerHTML = ''; // Очищаем старые сообщения

                    const { data, error } = await supabase
                        .from('grades')
                        .insert([{ student_name: studentName, subject: subject, grade: gradeValue }]);

                    if (error) {
                        statusDiv.className = 'error-box';
                        statusDiv.innerHTML = 'ОШИБКА БАЗЫ: ' + error.message;
                    } else {
                        statusDiv.className = 'success-box';
                        statusDiv.innerHTML = 'Оценка успешно сохранена!';
                        document.getElementById('studentName').value = '';
                        document.getElementById('subject').value = '';
                        document.getElementById('gradeValue').value = '';
                        loadGrades(); 
                    }
                }

                async function loadGrades() {
                    const { data, error } = await supabase
                        .from('grades')
                        .select('*')
                        .order('id', { ascending: false })
                        .limit(10);

                    if (error) {
                        listDiv.innerHTML = '';
                        statusDiv.className = 'error-box';
                        statusDiv.innerHTML = 'ОШИБКА ЗАГРУЗКИ: ' + error.message;
                        return;
                    }

                    if (data.length === 0) {
                        listDiv.innerHTML = 'Оценок пока нет.';
                        return;
                    }

                    listDiv.innerHTML = data.map(g => `
                        <div class="grade-item">
                            <span>${g.student_name} (${g.subject})</span>
                            <strong>${g.grade}</strong>
                        </div>
                    `).join('');
                }

                // Запускаем загрузку
                loadGrades();

            } catch (e) {
                listDiv.innerHTML = '';
                statusDiv.className = 'error-box';
                statusDiv.innerHTML = 'КРИТИЧЕСКАЯ ОШИБКА КОДА: ' + e.message;
            }
        }
    </script>
</body>
</html>
