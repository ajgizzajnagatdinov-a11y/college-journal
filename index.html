<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный журнал (Тест)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #1a1c23; color: white; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #262933; padding: 20px; border-radius: 12px; }
        h1 { text-align: center; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #3d4250; color: white; }
        button { background: #2196f3; color: white; font-weight: bold; cursor: pointer; }
        .grade-item { background: #2d3341; padding: 10px; margin-bottom: 5px; border-radius: 6px; display: flex; justify-content: space-between; }
        .error { color: #ff5252; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Электронный журнал (Тест)</h1>
        
        <h3>Выставить оценку</h3>
        <input type="text" id="studentName" placeholder="Фамилия студента (напр. Иванов)">
        <input type="text" id="subject" placeholder="Предмет (напр. Математика)">
        <input type="number" id="gradeValue" placeholder="Оценка (2-5)">
        <button onclick="addGrade()">Сохранить в базу</button>

        <h3>Последние оценки</h3>
        <div id="gradesList">Загрузка...</div>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        // ⚠️ ВАЖНО: Вставьте сюда URL и ключ от НОВОГО проекта Supabase (журнала)
        const SUPABASE_URL = 'СЮДА_ВСТАВЬТЕ_URL'; 
        const SUPABASE_KEY = 'СЮДА_ВСТАВЬТЕ_КЛЮЧ'; 
        
        // Проверка, что ключи вставлены
        if (SUPABASE_URL === 'СЮДА_ВСТАВЬТЕ_URL' || SUPABASE_KEY === 'СЮДА_ВСТАВЬТЕ_КЛЮЧ') {
            document.getElementById('errorMsg').textContent = 'Ошибка: Вы не вставили URL или ключ в код!';
            document.getElementById('gradesList').innerHTML = '';
        } else {
            const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            async function addGrade() {
                const studentName = document.getElementById('studentName').value;
                const subject = document.getElementById('subject').value;
                const gradeValue = parseInt(document.getElementById('gradeValue').value);

                if (!studentName || !subject || !gradeValue) {
                    alert('Заполните все поля!');
                    return;
                }

                document.getElementById('errorMsg').textContent = ''; // Очищаем ошибки

                const { data, error } = await supabase
                    .from('grades')
                    .insert([{ student_name: studentName, subject: subject, grade: gradeValue }]);

                if (error) {
                    document.getElementById('errorMsg').textContent = 'Ошибка базы: ' + error.message;
                } else {
                    alert('Оценка сохранена!');
                    document.getElementById('studentName').value = '';
                    document.getElementById('subject').value = '';
                    document.getElementById('gradeValue').value = '';
                    loadGrades(); 
                }
            }

            async function loadGrades() {
                const list = document.getElementById('gradesList');
                const { data, error } = await supabase
                    .from('grades')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(10);

                if (error) {
                    list.innerHTML = '';
                    document.getElementById('errorMsg').textContent = 'Ошибка загрузки: ' + error.message;
                    return;
                }

                if (data.length === 0) {
                    list.innerHTML = 'Оценок пока нет.';
                    return;
                }

                list.innerHTML = data.map(g => `
                    <div class="grade-item">
                        <span>${g.student_name} (${g.subject})</span>
                        <strong>${g.grade}</strong>
                    </div>
                `).join('');
            }

            loadGrades();
        }
    </script>
</body>
</html>
